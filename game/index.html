<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solmar Bay — an open-world crime story</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #11141b; }
  /* Two stacked canvases: #game is the raw-WebGL 3D world, #hud is the 2D
     overlay (HUD, minimap, menus) drawn on top. The HUD canvas never takes
     pointer events, so the mouse and clicks reach the game canvas below. */
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: crosshair; }
  #hud { position: fixed; inset: 0; width: 100%; height: 100%; display: block; pointer-events: none; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" aria-label="Solmar Bay: an open-world crime game. Explore the city on foot and by car, steal cars, dodge the police, and finish six missions to pay off Dario Cruz's debt."></canvas>
<canvas id="hud" aria-hidden="true"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
